[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-for-beam"
version = "0.1.0"
description = "Finite-element static, modal, and dynamic analysis of beams and planar frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "Pillow"]

[tool.setuptools.packages.find]
include = ["beam_fem*", "examples*"]
